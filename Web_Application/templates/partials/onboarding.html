<!-- Onboarding / Connect Dataset partial -->
<div class="flex-1 flex flex-col relative" style="background-color:rgba(0,0,0,0.4)">

  <main class="flex-grow flex items-center justify-center py-16 md:py-24 px-6 md:px-16 relative z-10">
    <div class="max-w-2xl w-full flex flex-col items-center">
      <div class="text-center mb-12">
        <div class="inline-flex items-center space-x-2 px-3 py-1 border border-surface-variant rounded-full mb-6 bg-surface-container/50 backdrop-blur-sm">
          <span class="material-symbols-outlined text-sm text-primary">data_object</span>
          <span class="font-label-mono text-label-mono text-primary uppercase">Workspace Initialization</span>
        </div>
        <h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary mb-4">
          Connect your First Dataset
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">
          Upload CSV, JSON, or connect directly to your data warehouse to
          begin model training.
        </p>
      </div>

      <!-- Upload Card -->
      <div class="w-full bg-surface-container-lowest/80 backdrop-blur-xl border border-surface-variant p-8 rounded-lg shadow-2xl" style="border-color: rgb(255,255,255)">
        <!-- Hidden file input -->
        <input type="file" id="dataset-upload-input" class="hidden" accept=".csv,.json,.parquet">

        <!-- Dropzone -->
        <div id="upload-zone" class="upload-dashed w-full h-64 flex flex-col items-center justify-center p-6 text-center cursor-pointer hover:bg-surface-container-low transition-colors group relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>

          <!-- Default state content -->
          <div id="upload-default-state">
            <div class="w-16 h-16 rounded-full bg-surface-variant flex items-center justify-center mb-4 group-hover:scale-110 transition-transform mx-auto">
              <span class="material-symbols-outlined text-3xl text-primary">cloud_upload</span>
            </div>
            <h3 class="font-headline-md text-headline-md text-primary mb-2">Drag &amp; Drop Files</h3>
            <p class="font-body-sm text-body-sm text-on-surface-variant">or click to browse local files</p>
            <p class="font-label-mono text-label-mono text-outline mt-4 uppercase">Max 500MB &bull; CSV, JSON, Parquet</p>
          </div>

          <!-- Uploading spinner state (hidden by default) -->
          <div id="upload-spinner-state" class="hidden flex flex-col items-center">
            <div class="w-12 h-12 border-2 border-outline-variant border-t-primary rounded-full animate-spin mb-4"></div>
            <p class="font-label-mono text-label-mono text-primary uppercase tracking-widest">Uploading &amp; Parsing...</p>
          </div>

          <!-- Error state (hidden by default) -->
          <div id="upload-error-state" class="hidden flex flex-col items-center">
            <div class="w-16 h-16 rounded-full bg-error-container/30 flex items-center justify-center mb-4 mx-auto">
              <span class="material-symbols-outlined text-3xl text-error">error</span>
            </div>
            <p id="upload-error-msg" class="font-body-sm text-body-sm text-error mb-4"></p>
            <button id="upload-retry-btn" class="px-6 py-2 border border-error text-error font-label-mono text-label-mono uppercase hover:bg-error/10 transition-colors rounded">
              Retry Upload
            </button>
          </div>
        </div>

        <div class="flex items-center w-full my-6">
          <div class="flex-grow border-t border-surface-variant"></div>
          <span class="px-4 font-label-mono text-label-mono text-on-surface-variant uppercase bg-surface-container-lowest">OR CONNECT</span>
          <div class="flex-grow border-t border-surface-variant"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <button class="flex items-center justify-center space-x-3 p-4 border border-surface-variant rounded hover:border-primary transition-colors bg-surface-container text-primary font-label-mono text-label-mono uppercase">
            <span class="material-symbols-outlined">database</span>
            <span>PostgreSQL</span>
          </button>
          <button class="flex items-center justify-center space-x-3 p-4 border border-surface-variant rounded hover:border-primary transition-colors bg-surface-container text-primary font-label-mono text-label-mono uppercase">
            <span class="material-symbols-outlined">storage</span>
            <span>Snowflake</span>
          </button>
        </div>
        <div class="mt-8 flex justify-end space-x-4">
          <button class="px-6 py-3 border border-surface-variant text-on-surface-variant font-label-mono text-label-mono uppercase hover:text-primary hover:border-outline transition-colors rounded">
            Skip for Now
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const fileInput = document.getElementById('dataset-upload-input');
  const uploadZone = document.getElementById('upload-zone');
  const defaultState = document.getElementById('upload-default-state');
  const spinnerState = document.getElementById('upload-spinner-state');
  const errorState = document.getElementById('upload-error-state');
  const errorMsg = document.getElementById('upload-error-msg');
  const retryBtn = document.getElementById('upload-retry-btn');

  let lastFile = null;

  function showState(state) {
    defaultState.classList.add('hidden');
    spinnerState.classList.add('hidden');
    errorState.classList.add('hidden');
    if (state === 'default') defaultState.classList.remove('hidden');
    if (state === 'uploading') spinnerState.classList.remove('hidden');
    if (state === 'error') errorState.classList.remove('hidden');
  }

  // Click to open file browser
  uploadZone.addEventListener('click', (e) => {
    if (e.target.closest('#upload-retry-btn')) return;
    if (spinnerState && !spinnerState.classList.contains('hidden')) return;
    fileInput.click();
  });

  // Drag/drop events
  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.stopPropagation();
    uploadZone.classList.add('bg-surface-container-low');
  });
  uploadZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    e.stopPropagation();
    uploadZone.classList.remove('bg-surface-container-low');
  });
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    uploadZone.classList.remove('bg-surface-container-low');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      lastFile = e.dataTransfer.files[0];
      uploadFile(lastFile);
    }
  });

  // File input change
  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files.length > 0) {
      lastFile = fileInput.files[0];
      uploadFile(lastFile);
    }
  });

  // Retry button
  retryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (lastFile) {
      uploadFile(lastFile);
    }
  });

  async function uploadFile(file) {
    // Show uploading state
    showState('uploading');
    uploadZone.style.pointerEvents = 'none';
    uploadZone.style.cursor = 'default';

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/api/v1/dataset/upload', {
        method: 'POST',
        body: formData,
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => null);
        const detail = errData?.detail || `Upload failed (HTTP ${res.status})`;
        throw new Error(detail);
      }

      const data = await res.json();

      // Success: store in sessionStorage and navigate
      sessionStorage.setItem('activeDataset', JSON.stringify(data));
      if (window.AppRouter && typeof window.AppRouter.navigate === 'function') {
        window.AppRouter.navigate('/workspace-empty');
      } else {
        window.location.href = '/workspace-empty';
      }
    } catch (err) {
      // Error state
      errorMsg.textContent = err.message || 'An unexpected error occurred.';
      showState('error');
      uploadZone.style.pointerEvents = '';
      uploadZone.style.cursor = 'pointer';
    }
  }
})();
</script>
