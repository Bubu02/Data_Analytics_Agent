<!-- Onboarding / Connect Dataset partial -->
<div class="flex-1 flex flex-col relative" style="background-color:rgba(0,0,0,0.4)">

  <main class="flex-grow flex items-center justify-center py-16 md:py-24 px-6 md:px-16 relative z-10">

          <span class="font-label-mono text-label-mono text-primary uppercase">Workspace Initialization</span>
        </div>

        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">

          begin model training.
        </p>
      </div>

      <!-- Upload Card -->
      <div class="w-full bg-surface-container-lowest/80 backdrop-blur-xl border border-surface-variant p-8 rounded-lg shadow-2xl" style="border-color: rgb(255,255,255)">
        <input type="file" id="dataset-upload-input" class="hidden" accept=".csv">
        <div id="upload-zone" class="upload-dashed w-full h-64 flex flex-col items-center justify-center p-6 text-center cursor-pointer hover:bg-surface-container-low transition-colors group relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
          <div class="w-16 h-16 rounded-full bg-surface-variant flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">

        </div>
        <div class="flex items-center w-full my-6">

            <span class="material-symbols-outlined">storage</span>
            <span>Snowflake</span>
          </button>
        </div>
        <div class="mt-8 flex justify-end space-x-4">
          <button class="px-6 py-3 border border-surface-variant text-on-surface-variant font-label-mono text-label-mono uppercase hover:text-primary hover:border-outline transition-colors rounded">
            Skip for Now
          </button>
        </div>
      </div>
