<!-- Empty Workspace partial -->
<main class="flex-1 flex relative grid-bg" style="background-color:rgb(0,0,0)">
  <!-- Central Canvas (Empty State) -->
  <div class="flex-1 flex items-center justify-center relative p-8">
    <div
      class="relative z-10 flex flex-col items-center text-center max-w-xl mx-auto border border-outline-variant bg-surface/80 backdrop-blur-md p-16 rounded"
      style="background-color: rgb(0,0,0)"
    >
      <div class="w-24 h-24 mb-8 text-on-surface-variant flex items-center justify-center opacity-50">
        <span class="material-symbols-outlined" style="font-size:64px">data_exploration</span>
      </div>
      <h1 class="font-headline-md text-headline-md text-primary mb-4 tracking-tight">
        Workspace is empty
      </h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant mb-12">
        Initialize a new data model or import a dataset to begin structural analysis.
      </p>
      <button class="bg-primary text-on-primary font-label-mono text-label-mono uppercase px-8 py-4 flex items-center space-x-2 hover:bg-tertiary-fixed-dim transition-colors">
        <span class="material-symbols-outlined text-sm">add</span>
        <span>New Analysis</span>
      </button>
    </div>
  </div>

  <!-- AI Copilot Panel -->
  <aside class="w-96 border-l border-outline-variant bg-surface flex flex-col h-[calc(100vh-3rem)]" style="background-color:rgb(0,0,0)">
    <!-- Chat Header -->
    <div class="h-14 border-b border-outline-variant flex items-center justify-between px-6 bg-surface-container-low" style="background-color:rgb(0,0,0)">
      <div class="flex items-center space-x-2">
        <span class="material-symbols-outlined text-primary text-sm">smart_toy</span>
        <span class="font-label-mono text-label-mono text-primary uppercase">Analytica Copilot</span>
      </div>
      <button class="text-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-sm">close_fullscreen</span>
      </button>
    </div>
    <!-- Chat Messages -->
    <div class="flex-1 overflow-y-auto p-6 flex flex-col space-y-6">
      <div class="flex flex-col space-y-2 max-w-[85%]">
        <div class="flex items-center space-x-2 mb-1">
          <span class="material-symbols-outlined text-primary text-xs">smart_toy</span>
          <span class="font-label-mono text-[10px] text-on-surface-variant uppercase tracking-widest">System</span>
        </div>
        <div class="bg-surface-variant border border-outline-variant rounded-r-lg rounded-bl-lg p-4 font-body-sm text-body-sm text-on-surface">
          <p class="mb-2">Workspace initialized. Environment parameters loaded.</p>
          <p>How would you like to proceed with your data modeling today?</p>
        </div>
        <!-- Suggested Actions -->
        <div class="flex flex-col space-y-2 mt-4">
          <button class="border border-outline-variant text-on-surface-variant hover:text-primary hover:border-primary font-label-mono text-[10px] uppercase py-2 px-3 text-left transition-colors flex justify-between items-center group">
            <span>Import CSV/JSON Dataset</span>
            <span class="material-symbols-outlined text-xs opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
          </button>
          <button class="border border-outline-variant text-on-surface-variant hover:text-primary hover:border-primary font-label-mono text-[10px] uppercase py-2 px-3 text-left transition-colors flex justify-between items-center group">
            <span>Connect Database</span>
            <span class="material-symbols-outlined text-xs opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
          </button>
        </div>
      </div>
    </div>
    <!-- Input Area -->
    <div class="p-4 border-t border-outline-variant" style="background-color:rgb(0,0,0)">
      <div class="relative flex items-center">
        <input
          class="w-full bg-background border border-outline-variant text-on-surface font-label-mono text-[10px] py-4 pl-4 pr-12 focus:outline-none focus:border-primary focus:ring-0 placeholder:text-on-surface-variant uppercase tracking-wider"
          placeholder="QUERY SYNTAX OR NATURAL LANGUAGE..."
          type="text"
        />
        <button class="absolute right-2 text-on-surface-variant hover:text-primary transition-colors p-2">
          <span class="material-symbols-outlined text-sm">send</span>
        </button>
      </div>
    </div>
  </aside>
</main>
