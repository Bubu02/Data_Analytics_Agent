    <style>
      .dot-grid { background-image: radial-gradient(circle at 1px 1px, #222222 1px, transparent 0); background-size: 24px 24px; }
      .dot-pattern { background-image: radial-gradient(#333333 1px, transparent 1px); background-size: 16px 16px; }
      .bg-dot-pattern { background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 16px 16px; }
      .grid-bg { background-image: linear-gradient(to right, #222 1px, transparent 1px), linear-gradient(to bottom, #222 1px, transparent 1px); background-size: 64px 64px; }
      .upload-dashed { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='8' ry='8' stroke='%23333333' stroke-width='2' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); border-radius: 8px; }
      .border-ghost { border: 1px solid #333333; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #131313; }
      ::-webkit-scrollbar-thumb { background: #333333; }
      ::-webkit-scrollbar-thumb:hover { background: #555555; }
      #page-content { transition: opacity 0.15s ease; }
      #page-content.is-loading { opacity: 0; pointer-events: none; }
      .side-nav-link.is-active { background-color: #ffffff !important; color: #2f3131 !important; }
      .top-nav-link.is-active { color: #ffffff; border-bottom: 1px solid #ffffff; padding-bottom: 4px; }
    </style>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="bg-black text-on-surface min-h-screen flex overflow-hidden font-body-lg antialiased" style="background-color:rgb(0,0,0)">

    <!-- PERSISTENT SIDE NAV -->
    <nav id="side-nav" class="border-r border-outline-variant h-screen w-16 fixed left-0 top-0 flex flex-col items-center py-8 space-y-6 z-50" style="background-color:rgb(0,0,0)">
      <div class="mb-8 flex flex-col items-center group cursor-pointer">
        <div class="w-10 h-10 border border-outline-variant flex items-center justify-center rounded mb-2 group-hover:border-primary transition-colors">
          <span class="material-symbols-outlined text-primary" style="font-variation-settings:'FILL' 1">analytics</span>
        </div>
      </div>
      <div class="flex-1 flex flex-col space-y-4 w-full px-2">
        <a class="side-nav-link w-full flex justify-center py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest hover:text-primary transition-all scale-95 duration-150 cursor-pointer" data-page="homepage" href="/homepage" title="Homepage">
          <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">grid_view</span>
        </a>
        <a class="side-nav-link w-full flex justify-center py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest hover:text-primary transition-all scale-95 duration-150 cursor-pointer" data-page="onboarding" href="/onboarding" title="Connect Data">
          <span class="material-symbols-outlined">database</span>
        </a>
        <a class="side-nav-link w-full flex justify-center py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest hover:text-primary transition-all scale-95 duration-150 cursor-pointer" data-page="workspace-empty" href="/workspace-empty" title="Empty Workspace">
          <span class="material-symbols-outlined">cloud_download</span>
        </a>
        <a class="side-nav-link w-full flex justify-center py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest hover:text-primary transition-all scale-95 duration-150 cursor-pointer" data-page="workspace-populated" href="/workspace-populated" title="Analytics Workspace">
          <span class="material-symbols-outlined">terminal</span>
        </a>
        <a class="side-nav-link w-full flex justify-center py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest hover:text-primary transition-all scale-95 duration-150 cursor-pointer" href="#" title="Archive">
          <span class="material-symbols-outlined">archive</span>
        </a>
      </div>
      <div class="flex flex-col space-y-4 w-full px-2 mt-auto">
        <a class="w-full flex justify-center py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-highest hover:text-primary transition-all scale-95 duration-150 cursor-pointer" href="#" title="Help">

        </a>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 ml-16 flex flex-col">

      <!-- PERSISTENT TOP NAV -->

        <div class="flex items-center gap-4">
          <span class="font-label-mono text-label-mono tracking-widest text-primary uppercase">ANALYTICA AI</span>
        </div>
        <nav class="hidden md:flex items-center gap-6">
          <a class="top-nav-link font-label-mono text-label-mono text-on-surface-variant hover:text-primary transition-colors" data-page="homepage" href="/homepage">1. Homepage</a>
          <a class="top-nav-link font-label-mono text-label-mono text-on-surface-variant hover:text-primary transition-colors" data-page="onboarding" href="/onboarding">2. Connect Data</a>
          <a class="top-nav-link font-label-mono text-label-mono text-on-surface-variant hover:text-primary transition-colors" data-page="workspace-empty" href="/workspace-empty">3. Empty Workspace</a>
          <a class="top-nav-link font-label-mono text-label-mono text-on-surface-variant hover:text-primary transition-colors" data-page="workspace-populated" href="/workspace-populated">4. Populated Workspace</a>
        </nav>
        <div class="flex items-center gap-4">
          <button class="text-primary hover:opacity-70 transition-opacity duration-200 cursor-pointer active:opacity-50">

          </button>
          <button class="text-primary hover:opacity-70 transition-opacity duration-200 cursor-pointer active:opacity-50">
            <span class="material-symbols-outlined text-[20px]">settings</span>
          </button>
          <button class="text-primary hover:opacity-70 transition-opacity duration-200 cursor-pointer active:opacity-50 relative">
            <span class="material-symbols-outlined text-[20px]">notifications</span>
            <span class="absolute top-0 right-0 w-2 h-2 bg-primary rounded-full"></span>
          </button>
        </div>
      </header>

      <!-- PAGE CONTENT — only this div swaps on navigation -->
      <div id="page-content" class="flex-1 flex flex-col overflow-hidden">
        {% include "partials/" + initial_page + ".html" %}
      </div>

    </div>

    <!-- CLIENT-SIDE ROUTER -->
    <script>
      (() => {
        const ROUTES = {
          '/homepage':            'homepage',
          '/onboarding':          'onboarding',
          '/workspace-empty':     'workspace-empty',
          '/workspace-populated': 'workspace-populated',
        };
        const PAGE_TITLES = {
          'homepage':            'Analytica AI - Homepage',
          'onboarding':          'Analytica AI - Connect Dataset',
          'workspace-empty':     'Analytica AI - Empty Workspace',
          'workspace-populated': 'Analytica AI - Analytics Workspace',
        };
        const contentEl = document.getElementById('page-content');

        function setActiveStates(page) {
          document.querySelectorAll('.side-nav-link[data-page]').forEach(el => {
            el.classList.toggle('is-active', el.dataset.page === page);
          });
          document.querySelectorAll('.top-nav-link[data-page]').forEach(el => {
            el.classList.toggle('is-active', el.dataset.page === page);
          });
        }

        function execScripts(container) {
          container.querySelectorAll('script').forEach(old => {
            const s = document.createElement('script');
            [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
            s.textContent = old.textContent;
            old.replaceWith(s);
          });
        }

        async function navigate(url, pushState = true) {
          const page = ROUTES[url];
          if (!page) { window.location.href = url; return; }

          try {
            contentEl.classList.add('is-loading');
            const res = await fetch('/partial/' + page, {
              headers: { 'X-Partial-Request': '1' },
              cache: 'no-store',
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const html = await res.text();

            await new Promise(r => setTimeout(r, 150));
            contentEl.innerHTML = html;
            execScripts(contentEl);
            contentEl.classList.remove('is-loading');

            if (pushState) history.pushState({ page, url }, '', url);
            document.title = PAGE_TITLES[page] || 'Analytica AI';
            setActiveStates(page);
          } catch (err) {
            console.error('[Router] falling back:', err);
            contentEl.classList.remove('is-loading');
            window.location.href = url;
          }
        }

        document.addEventListener('click', e => {
          const link = e.target.closest('a[href]');
          if (!link) return;
          const href = link.getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('http') || !(href in ROUTES)) return;
          e.preventDefault();
          navigate(href);
        });

        window.addEventListener('popstate', e => {
          if (e.state?.url) navigate(e.state.url, false);
        });

        const initialPage = ROUTES[window.location.pathname] || 'homepage';
        setActiveStates(initialPage);
        history.replaceState({ page: initialPage, url: window.location.pathname }, '', window.location.pathname);
      })();
    </script>
  </body>
</html>
