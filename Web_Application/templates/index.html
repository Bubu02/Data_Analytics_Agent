<!doctype html>
<html lang="en" class="dark bg-black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stitch AI Data Workspace - Master Hub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#131313",
              "surface-container": "#1f1f1f",
              "surface-container-low": "#1b1b1b",
              "surface-container-lowest": "#0e0e0e",
              primary: "#ffffff",
              "on-surface": "#e2e2e2",
              "on-surface-variant": "#c4c7c8",
              outline: "#8e9192",
              "outline-variant": "#444748",
              "panel-border": "#222222",
            },
            fontFamily: {
              body: ["Hanken Grotesk", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      .dot-grid {
        background-image: radial-gradient(
          circle at 1px 1px,
          #222222 1px,
          transparent 0
        );
        background-size: 24px 24px;
      }

      .tab-btn.active {
        background-color: #ffffff;
        color: #000000;
        border-color: #ffffff;
      }
    </style>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>

  <body
    class="bg-black text-on-surface font-body min-h-screen flex flex-col antialiased overflow-hidden"
  >
    <!-- Master Top Navigation Bar -->
    <header
      class="w-full h-14 bg-black border-b border-outline-variant flex justify-between items-center px-6 z-50"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 border border-outline-variant flex items-center justify-center rounded"
        >
          <span class="material-symbols-outlined text-primary text-lg"
            >analytics</span
          >
        </div>
        <div>
          <span
            class="font-mono text-sm tracking-widest text-primary uppercase font-bold"
            >STITCH AI DATA WORKSPACE</span
          >
          <span
            class="text-xs text-on-surface-variant ml-2 font-mono hidden sm:inline-block"
            >// 4 Connected Precision Dashboards</span
          >
        </div>
      </div>

      <!-- Dashboard Switcher Tabs -->
      <nav class="flex items-center gap-2">
        <button
          onclick="switchDashboard('/homepage', this)"
          class="tab-btn active font-mono text-xs px-3 py-1.5 border border-outline-variant rounded transition-all flex items-center gap-1.5"
        >
          <span class="material-symbols-outlined text-xs">home</span>
          <span>1. Homepage</span>
        </button>

        <button
          onclick="switchDashboard('/onboarding', this)"
          class="tab-btn font-mono text-xs px-3 py-1.5 border border-outline-variant text-on-surface-variant hover:text-primary hover:border-outline transition-all flex items-center gap-1.5"
        >
          <span class="material-symbols-outlined text-xs">cloud_upload</span>
          <span>2. Connect Data</span>
        </button>

        <button
          onclick="switchDashboard('/workspace-empty', this)"
          class="tab-btn font-mono text-xs px-3 py-1.5 border border-outline-variant text-on-surface-variant hover:text-primary hover:border-outline transition-all flex items-center gap-1.5"
        >
          <span class="material-symbols-outlined text-xs">grid_view</span>
          <span>3. Empty State</span>
        </button>

        <button
          onclick="switchDashboard('/workspace-populated', this)"
          class="tab-btn font-mono text-xs px-3 py-1.5 border border-outline-variant text-on-surface-variant hover:text-primary hover:border-outline transition-all flex items-center gap-1.5"
        >
          <span class="material-symbols-outlined text-xs">monitoring</span>
          <span>4. Analytics Workspace</span>
        </button>
      </nav>

      <!-- Header Actions -->
      <div class="flex items-center gap-3">
        <a
          id="popoutLink"
          href="/homepage"
          target="_blank"
          title="Open current dashboard in full page"
          class="font-mono text-xs border border-outline-variant text-on-surface-variant hover:text-primary hover:border-primary px-3 py-1.5 rounded flex items-center gap-1 transition-colors"
        >
          <span>Open Standalone</span>
          <span class="material-symbols-outlined text-xs">open_in_new</span>
        </a>
        <div
          class="flex items-center gap-2 pl-2 border-l border-outline-variant"
        >
          <span
            class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"
          ></span>
          <span class="font-mono text-xs text-emerald-400">ENGINE ONLINE</span>
        </div>
      </div>
    </header>

    <!-- Viewport Area -->
    <main class="flex-1 w-full h-[calc(100vh-3.5rem)] relative bg-black">
      <iframe
        id="dashboardFrame"
        src="homepage.html"
        class="w-full h-full border-0"
        title="Stitch Dashboard Viewport"
      ></iframe>
    </main>

    <script>
      function switchDashboard(url, btnElement) {
        document.getElementById("dashboardFrame").src = url;
        document.getElementById("popoutLink").href = url;

        const buttons = document.querySelectorAll(".tab-btn");
        buttons.forEach((btn) => {
          btn.classList.remove(
            "active",
            "bg-white",
            "text-black",
            "border-white",
          );
          btn.classList.add("text-on-surface-variant");
        });

        btnElement.classList.add(
          "active",
          "bg-white",
          "text-black",
          "border-white",
        );
        btnElement.classList.remove("text-on-surface-variant");
      }
    </script>
  </body>
</html>
